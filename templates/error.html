{% extends "base.html" %}

{% block title %}{{ error_code }} — {{ error_title }}{% endblock %}
{% block page_heading %}Error {{ error_code }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6 text-center py-5">
    <div class="card-healthcare p-5">
      <div class="display-1 fw-bold text-primary mb-2">{{ error_code }}</div>
      <h3 class="fw-bold text-dark mb-3">{{ error_title }}</h3>
      <p class="text-muted mb-4">{{ error_message }}</p>
      <div>
        <a href="{{ url_for('dashboard') }}" class="btn btn-med-primary px-4">
          <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
